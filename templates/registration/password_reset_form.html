{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña | Sorpresas Kawaii</title>
    <link rel="stylesheet" href="{% static 'css/kawaii_admin.css' %}">
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}?v=edukit2">
    <link rel="alternate icon" type="image/png" href="{% static 'img/favicon.png' %}?v=edukit2">
</head>
<body>
    {% include "partials/navbar.html" %}
    <main class="login-container">
        <h1>Recupera tu contraseña</h1>
        <p>Escribe el correo con el que creaste tu cuenta.</p>
        <form class="login-form" method="post">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Enviar enlace</button>
        </form>
        <a class="secondary-button" href="{% url 'login' %}">Volver</a>
    </main>
</body>
</html>
