{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresas Kawaii | {% block title %}{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}?v=edukit2">
    <link rel="alternate icon" type="image/png" href="{% static 'img/favicon.png' %}?v=edukit2">

    <!-- Fuentes y Tipografía Kawaii -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Hoja de Estilos Maestra -->
    <link rel="stylesheet" href="{% static 'css/kawaii_admin.css' %}?v=3.0">


    {% block extra_head %}{% endblock %}
</head>
<body class="kawaii-body">
    {% include "partials/navbar.html" %}

    <main class="content-container">
        {% block content %}
        {% endblock content %}
    </main>

    {% include "partials/footer.html" %}

    {% block extra_js %}{% endblock %}
</body>
</html>
