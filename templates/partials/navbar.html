{% load static %}
<header class="kawaii-navbar">
    <div class="navbar-container">
        <!-- Logo / Marca a la izquierda -->
        <div class="navbar-brand">
            <a href="{% url 'inicio' %}" class="brand-link" title="Edukit · Sorpresas Kawaii">
                <img src="{% static 'img/logo_edukit_sorpresas_kawaii.png' %}" alt="Edukit - Sorpresas Kawaii" class="brand-logo-img" style="height: 48px; max-height: 48px; width: auto; max-width: 170px; object-fit: contain; vertical-align: middle;" height="48" onerror="this.onerror=null; this.style.display='none'; document.getElementById('brandFallbackText').style.display='inline-flex';">
                <span id="brandFallbackText" class="brand-fallback-text" style="display:none;">
                    <span class="brand-sparkle">💖</span>
                    <span class="brand-name">Edukit · <span class="brand-highlight">Kawaii</span></span>
                </span>
            </a>
        </div>

        <!-- Navegación de Catálogo al centro -->
        <nav class="navbar-center" aria-label="Navegación principal">
            <a href="{% url 'inicio' %}" class="nav-item {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}">Inicio</a>
            <a href="{% url 'lista_productos' %}" class="nav-item {% if request.resolver_match.url_name == 'lista_productos' %}active{% endif %}">Productos</a>
            <a href="{% url 'lista_combos' %}" class="nav-item {% if request.resolver_match.url_name == 'lista_combos' %}active{% endif %}">Combos</a>
            <a href="{% url 'lista_sorpresas' %}" class="nav-item {% if request.resolver_match.url_name == 'lista_sorpresas' %}active{% endif %}">Sorpresas</a>
        </nav>

        <!-- Acciones de Usuario a la derecha -->
        <div class="navbar-actions">
            {% if user.is_authenticated %}
                <a href="{% url 'ver_carrito' %}" class="btn-nav-action btn-cart" title="Ver Carrito">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Carrito</span>
                    {% if carrito_total_items > 0 %}
                        <span class="cart-badge">{{ carrito_total_items }}</span>
                    {% endif %}
                </a>

                <a href="{% url 'mis_pedidos' %}" class="btn-nav-action btn-orders" title="Mis Pedidos">
                    <i class="fa-solid fa-box-open"></i>
                    <span>Pedidos</span>
                </a>
                <a href="{% url 'logout' %}" class="btn-nav-logout" title="Cerrar sesión">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="btn-nav-login">Login</a>
                <a href="{% url 'register' %}" class="btn-nav-register">Registro</a>
            {% endif %}
        </div>
    </div>
</header>
